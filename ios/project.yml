# XcodeGen spec: `xcodegen generate` in this directory creates ShojiProbe.xcodeproj.
name: ShojiProbe
options:
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  ShojiCardKit:
    path: ShojiCardKit
  ShojiProverKit:
    path: ShojiProverKit
targets:
  ShojiProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - ShojiProbe.entitlements
          - ProverResources
      # Circuit, verification key, reference string and benchmark inputs, copied
      # into the app as a folder. Created by scripts/prepare-resources.sh.
      - path: App/ProverResources
        type: folder
        buildPhase: resources
    dependencies:
      - package: ShojiCardKit
      - package: ShojiProverKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.keitaj.shoji.probe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: shoji probe
        CODE_SIGN_ENTITLEMENTS: App/ShojiProbe.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
