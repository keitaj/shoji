name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NOIR_VERSION: v1.0.0
  NOIR_SHA256: a62f5b44a6db8ca8f0c20f841aa788ea56776e5aaf2ebd672c02dcf397901264
  BB_VERSION: v6.0.0
  BB_SHA256: 6a310ede6457cf47e6dcf11f8d6b59dd709328c272a70c03afb1417c5a798b67

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install nargo and bb (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o noir.tar.gz "https://github.com/noir-lang/noir/releases/download/${NOIR_VERSION}/noir-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o bb.tar.gz "https://github.com/AztecProtocol/aztec-packages/releases/download/${BB_VERSION}/barretenberg-amd64-linux.tar.gz"
          echo "${NOIR_SHA256}  noir.tar.gz" | sha256sum -c
          echo "${BB_SHA256}  bb.tar.gz" | sha256sum -c
          mkdir -p "$HOME/.nargo/bin" "$HOME/.bb"
          tar -xzf noir.tar.gz -C "$HOME/.nargo/bin"
          tar -xzf bb.tar.gz -C "$HOME/.bb"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"

      - name: Go formatting and vet
        run: |
          make fixtures
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Build circuit
        run: make circuit

      - name: Test
        run: make test
