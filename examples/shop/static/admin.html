<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運営者の画面 - こもれび商店（shoji デモ）</title>
<style>
  :root { --bg: #f5f3ee; --surface: #fffefb; --fg: #20231f; --muted: #636a60; --line: #dcd9cf; --accent: #2f5d50; --ng: #a23a2c; --ng-bg: #f8e4e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.8;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; font-size: 15px; }
  .demo-bar { background: var(--fg); color: var(--bg); font-size: 13px; padding: 6px 16px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .demo-bar a { color: inherit; }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 32px; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0; max-width: 42em; }
  section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lead { color: var(--muted); }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.id { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; white-space: nowrap; }
  td.text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 14em; }
  .empty { color: var(--muted); font-size: 14px; }
  .stopped { color: var(--ng); background: var(--ng-bg); font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; margin-left: 6px; }
  button { font: inherit; font-size: 13px; cursor: pointer; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 2px 12px; white-space: nowrap; }
  button.stop { border-color: var(--ng); color: var(--ng); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  pre { margin: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; font-family: ui-monospace, Menlo, monospace; }
</style>

<div class="demo-bar">
  <span>これは shoji のデモです。この画面にログインはありません。</span>
  <a href="/">お店に戻る</a>
</div>

<main>
  <header>
    <h1>運営者の画面</h1>
    <p class="lead">お店が利用者について持っているのは、このお店専用の匿名 ID だけです。氏名、住所、生年月日、メールアドレスはありません。</p>
  </header>

  <section>
    <h2>利用者</h2>
    <p class="lead">利用を停止すると、その人は同じカードで何度確認しても、購入もレビューもできなくなります。レビューは非表示になります。</p>
    <div id="people"></div>
  </section>

  <section>
    <h2>購入</h2>
    <div id="purchases"></div>
  </section>

  <section>
    <h2>レビュー</h2>
    <div id="reviews"></div>
  </section>

  <section>
    <h2>お店が保存しているデータのすべて</h2>
    <p class="lead">下の内容が外に漏れても、誰の記録なのかは分かりません。匿名 ID はこのお店専用で、ほかのサービスの ID とは一致しません。</p>
    <pre id="raw"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const short = n => n.slice(0, 10) + '…' + n.slice(-6);
const time = t => new Date(t).toLocaleString('ja-JP');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function table(target, heads, rows) {
  if (rows.length === 0) { $(target).replaceChildren(el('p', 'empty', 'まだありません。')); return; }
  const t = el('table'), head = el('tr');
  heads.forEach(h => head.append(el('th', '', h)));
  t.append(head);
  rows.forEach(cells => { const tr = el('tr'); cells.forEach(c => tr.append(c)); t.append(tr); });
  const wrap = el('div', 'scroll'); wrap.append(t);
  $(target).replaceChildren(wrap);
}

async function setBanned(nullifier, banned) {
  await fetch('/api/admin/ban', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nullifier, banned }) });
  load();
}

async function load() {
  const s = await (await fetch('/api/admin/state')).json();
  const name = Object.fromEntries(s.products.map(p => [p.id, p.name]));
  const banned = new Set(s.banned);

  const people = new Map();
  const person = n => { if (!people.has(n)) people.set(n, { purchases: 0, reviews: 0 }); return people.get(n); };
  s.purchases.forEach(p => person(p.nullifier).purchases++);
  s.reviews.forEach(r => person(r.nullifier).reviews++);
  s.banned.forEach(n => person(n));

  table('people', ['匿名 ID', '購入', 'レビュー', ''], [...people].map(([n, c]) => {
    const id = el('td', 'id', short(n));
    if (banned.has(n)) id.append(el('span', 'stopped', '停止中'));
    const btn = el('button', banned.has(n) ? '' : 'stop', banned.has(n) ? '停止を解除' : '利用を停止');
    btn.type = 'button'; btn.onclick = () => setBanned(n, !banned.has(n));
    const act = el('td'); act.append(btn);
    return [id, el('td', '', c.purchases + ' 件'), el('td', '', c.reviews + ' 件'), act];
  }));

  table('purchases', ['日時', '品', '注文したのは', '匿名 ID'], s.purchases.map(p =>
    [el('td', '', time(p.at)), el('td', '', name[p.product] || p.product), el('td', '', p.agent ? 'エージェント' : '本人（カード）'), el('td', 'id', short(p.nullifier))]));

  table('reviews', ['日時', '品', '評価', '本文', '匿名 ID'], s.reviews.map(r =>
    [el('td', '', time(r.at)), el('td', '', name[r.product] || r.product), el('td', '', '★'.repeat(r.rating)), el('td', 'text', r.text), el('td', 'id', short(r.nullifier))]));

  $('raw').textContent = JSON.stringify({ purchases: s.purchases, reviews: s.reviews, banned: s.banned }, null, 2);
}

load();
setInterval(load, 3000);
</script>
</html>
